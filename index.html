<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Policy Checker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="menu-items" aria-label="Application menu">
            <div class="menu-item">File</div>
            <div class="menu-item">History</div>
            <div class="menu-item active">Policy</div>
            <div class="menu-item">Settings</div>
        </div>

        <div class="window-controls">
            <button id="winMinimize" class="control-icon" aria-label="Minimize"><i class="far fa-window-minimize"></i></button>
            <button id="winMaximize" class="control-icon" aria-label="Maximize"><i class="far fa-window-maximize"></i></button>
            <button id="winClose" class="control-icon close" aria-label="Close"><i class="fas fa-times"></i></button>
        </div>
    </header>

    <main>
        <div class="search-section">
            <div class="search-bar">
                <textarea id="urlInput" class="search-input" rows="1" autocomplete="off"
                    placeholder="Paste YouTube link to check TikTok policy..."
                    aria-label="YouTube video URLs"></textarea>
                <button id="analyzeBtn" class="download-btn" type="button" title="Analyze" aria-label="Analyze video">
                    <i id="analyzeIcon" class="fas fa-shield-alt"></i>
                </button>
            </div>
        </div>

        <section id="analysisQueue" class="queue-panel glass-panel" aria-label="Analysis queue">
            <div class="queue-toolbar">
                <strong id="queueSummary">Queued 0 · Running 0 · Completed 0</strong>
                <div class="queue-actions">
                    <button id="pauseQueueBtn" type="button">Pause</button>
                    <button id="cancelPendingBtn" type="button">Cancel pending</button>
                    <button id="exportCsvBtn" type="button">CSV</button>
                    <button id="exportJsonBtn" type="button">JSON</button>
                </div>
            </div>
            <div class="queue-filters">
                <input id="historySearch" type="search" placeholder="Search title, channel, video ID" aria-label="Search analysis history">
                <select id="resultFilter" aria-label="Filter analysis results">
                    <option value="">All results</option><option>HAS_REMOVE</option><option>HAS_REVIEW</option><option>SAFE</option><option>FAILED</option>
                </select>
            </div>
            <details class="queue-maintenance"><summary>Storage & maintenance</summary>
                <div><span id="storageUsage">Loading storage…</span>
                    <button id="clearQwenBtn" type="button">Clear Qwen cache</button>
                    <button id="clearVisualBtn" type="button">Clear visual cache</button>
                    <button id="clearReportsBtn" type="button">Clear reports</button>
                    <button id="openTranscriptSessionBtn" type="button">Open YouTube Session</button>
                    <span id="transcriptExtensionStatus">Transcript fallback: checking…</span>
                    <label>Keep reports <select id="retentionDays"><option value="0">Indefinitely</option><option value="30">30 days</option><option value="90">90 days</option><option value="365">1 year</option></select></label>
                </div>
            </details>
            <div id="analysisJobList" class="analysis-job-list"></div>
        </section>

        <section id="policyResult" class="policy-result" aria-live="polite"></section>
    </main>

    <footer>
        <div id="engineLabel" class="footer-center">Queue: 0 | Analyzing: 0 | Checked: 0</div>
    </footer>

    <script src="services/policyAnalysis/index.js"></script>
    <script src="renderer.js"></script>
</body>
</html>
